spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/book_social_network
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: on
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgresSLDialect
  mail:
    host: localport
    port: 1025
    username: Abdullah
    password: Abdullah
    properties:
      mail :
        smtp:
          trust : "*"
        auth : true
        starttls :
          enable :
        connectiontimeout: 5000
        timeout : 3000
        writetimeout : 5000

